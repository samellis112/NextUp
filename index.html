<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Next Up — A Daily Reasoning Challenge</title>
<meta name="description" content="Five pattern puzzles a day. Spot the rule, beat your streak, share your grid." />
<meta property="og:title" content="Next Up — A Daily Reasoning Challenge" />
<meta property="og:description" content="Five pattern puzzles a day. Spot the rule, beat your streak, share your grid." />
<meta name="theme-color" content="#024089" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=63">
</head>
<body>
  <!-- Landing-page sky: light at the top fading to night at the bottom. When a
       round starts it slides down out of view (see playTransition in game.js). -->
  <div class="home-sky" aria-hidden="true"></div>
  <!-- Account widget: fixed top-right, visible on every screen -->
  <div class="account-bar" id="account-bar"></div>

  <div class="container">

    <!-- ============ INVITE LANDING (only pre-auth gate left) ============ -->
    <div class="screen login" id="screen-invite">
      <div class="login-card">
        <h1 id="invite-heading">You're invited!</h1>
        <p class="subtitle" id="invite-subtitle">Loading invite…</p>
        <button class="btn-google" id="btn-invite-google"></button>
        <button class="back-link" id="btn-invite-skip">Not now — just play</button>
      </div>
    </div>

    <!-- ============ DAILY INTRO (default landing while today's daily is unfinished) ============ -->
    <div class="screen menu daily-intro" id="screen-daily-intro">
      <h1 class="logo-hero" aria-label="Next Up"></h1>
      <div class="subtitle" id="intro-title">Daily</div>
      <button class="go-btn" id="btn-start-daily">
        <span class="go-word">PLAY</span>
        <span class="sub-note">5 puzzles · timed</span>
      </button>
      <p class="intro-note" id="intro-sub"></p>
      <div class="menu-links">
        <button class="menu-link" id="btn-intro-menu">Main menu</button>
        <span aria-hidden="true">·</span>
        <button class="menu-link" id="btn-intro-howto">How to play</button>
        <span aria-hidden="true">·</span>
        <button class="menu-link" id="btn-intro-try">Try one puzzle</button>
      </div>
      <button class="leaderboard-big" id="btn-intro-leaderboard">🏆 Leaderboard</button>
    </div>

    <!-- ============ MAIN MENU ============ -->
    <div class="screen menu" id="screen-menu">
      <h1 class="logo-hero" aria-label="Next Up"></h1>
      <div class="streak-chip" id="streak-chip" hidden></div>

      <button class="go-btn" id="btn-daily">
        <span class="go-word">PLAY</span>
        <span class="sub-note" id="go-note">Play today's challenge</span>
      </button>

      <button class="leaderboard-big" id="btn-leaderboard">🏆 Leaderboard</button>

      <div class="menu-divider">Practice</div>
      <div class="diff-row" id="diff-row" role="group" aria-label="Practice difficulty">
        <button data-diff="easy">Easy</button>
        <button data-diff="medium" class="active">Medium</button>
        <button data-diff="hard">Hard</button>
      </div>
      <div class="menu-actions">
        <button id="btn-practice">Practice Round</button>
        <button id="btn-try">Try One Puzzle</button>
      </div>
      <div class="menu-links">
        <button class="menu-link" id="btn-stats">My Stats</button>
        <span aria-hidden="true">·</span>
        <button class="menu-link" id="btn-history">History</button>
        <span aria-hidden="true">·</span>
        <button class="menu-link" id="btn-howto">How to Play</button>
      </div>
    </div>

    <!-- ============ ROUND (puzzle-first: full-width progress, corner HUD) ============ -->
    <div class="screen" id="screen-round">
      <div class="progress-bar round-progress"><div class="progress-fill" id="progress"></div></div>
      <div class="corner-hud" aria-label="Round status">
        <span class="hud-q" id="problemNum">1/5</span>
        <button class="hud-btn" id="btn-mute" aria-label="Toggle sound">🔊</button>
        <button class="hud-btn" id="btn-quit" aria-label="Quit round">✕</button>
      </div>

      <div class="panel">
        <div class="round-timer" id="timer" aria-label="Total time">0.00s</div>
        <div class="instruction" id="instruction" hidden></div>
        <div class="sequence" id="sequence"></div>
        <div id="answer-builder"></div>

      </div>
      <!-- outside .panel: the panel animates (lift/drop/shake), which would
           otherwise drag this pinned bar along with it -->
      <div class="result-bar">
        <div class="feedback">
          <div class="msg" id="msg"></div>
          <button class="next" id="next" hidden aria-label="Next puzzle">→</button>
        </div>
        <div class="rule-note" id="rule-note" hidden></div>
      </div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div class="screen" id="screen-results">
      <div class="results" id="results-body"></div>
    </div>

    <!-- ============ STATS ============ -->
    <div class="screen stats-screen" id="screen-stats">
      <h2>My Stats</h2>
      <div class="subtitle" id="stats-signin-note">Saved on this device — sign in to keep them everywhere.</div>
      <div id="stats-content"></div>
      <div class="history-actions">
        <button class="back-link" id="btn-stats-back">← Main Menu</button>
      </div>
    </div>

    <!-- ============ HISTORY ============ -->
    <div class="screen history" id="screen-history">
      <h2>Practice History</h2>
      <div class="subtitle">Sorted by most recent. Lower average time is better.</div>
      <div id="history-content"></div>
      <div class="history-actions">
        <button class="back-link" id="btn-history-back">← Main Menu</button>
      </div>
    </div>

    <!-- ============ LEADERBOARD (daily board + friend groups) ============ -->
    <div class="screen" id="screen-leaderboard">
      <div class="leaderboard">
        <h2>Leaderboard</h2>
        <div class="subtitle" id="leaderboard-subtitle">Today's daily — fewest tries first, then fastest time.</div>
        <div class="lb-tabs" id="leaderboard-tabs" role="tablist" aria-label="Leaderboard sections"></div>
        <div id="leaderboard-content"></div>
        <button class="back-link" id="btn-leaderboard-back">← Main Menu</button>
      </div>
    </div>

  </div>

  <footer class="site-footer">
    <a href="/privacy">Privacy</a>
    <span aria-hidden="true">·</span>
    <a href="/terms">Terms</a>
  </footer>

  <!-- ============ MODAL ============ -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/logo.js?v=18"></script>
<script type="module" src="js/game.js?v=61"></script>
</body>
</html>
